<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENT COUNTDOWN</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #043899 0%, #c9d9f5 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .countdown {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .time-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 80px;
        }
        .number {
            font-size: 3rem;
            font-weight: bold;
            display: block;
        }
        .label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ddd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">EventCountdown Para sayo UM</h1>
    <div class="countdown">
        <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
        <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
    </div>
</div>

<script>
    // 1. SET YOUR TARGET DATE IN PHILIPPINE TIME HERE
    // Format: YYYY-MM-DDTHH:MM:SS+08:00
    // Example below is set to New Year's Eve 2026 midnight Manila Time
   const targetDateString = "2026-08-16T17:30:00+08:00";  
    
    // Parse the target date string into absolute UTC milliseconds
    const targetDate = Date.parse(targetDateString);

    function updateCountdown() {
        // Get the current global absolute UTC time milliseconds
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (isNaN(targetDate)) {
            document.querySelector(".container").innerHTML = "<h2>Invalid Date Format!</h2>";
            clearInterval(timerInterval);
            return;
        }

        if (difference <= 0) {
            document.querySelector(".countdown").innerHTML = "<h2>The Event Has Started!</h2>";
            clearInterval(timerInterval);
            return;
        }

        // Time calculations for days, hours, minutes and seconds
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        // Display the results with leading zeros
        document.getElementById("days").innerText = days.toString().padStart(2, '0');
        document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
        document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
        document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
    }

    // Update the count down every 1 second
    const timerInterval = setInterval(updateCountdown, 1000);
    updateCountdown(); // Run immediately on load
</script>

</body>
</html>
